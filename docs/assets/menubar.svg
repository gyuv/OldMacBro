<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1426"/><stop offset="1" stop-color="#070a12"/></linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#54EDB8" stop-opacity="0.35"/><stop offset="1" stop-color="#54EDB8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#9E7AFF" stop-opacity="0.3"/><stop offset="1" stop-color="#9E7AFF" stop-opacity="0"/></radialGradient>
    <clipPath id="pop"><rect x="10" y="34" width="420" height="556" rx="18"/></clipPath>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2a4a"/><stop offset="1" stop-color="#2b1d40"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CC7FF"/><stop offset="1" stop-color="#3a9fd8"/></linearGradient>
  </defs>
  <rect width="440" height="600" fill="url(#desk)"/>
  <!-- menu bar strip -->
  <rect width="440" height="28" fill="#1b1f2b"/>
  <g font-size="12" fill="#e7ecf5">
    <rect x="300" y="7" width="15" height="13" rx="3" fill="none" stroke="#e7ecf5" stroke-width="1.4"/>
    <rect x="303.5" y="10.5" width="8" height="6" rx="1" fill="#54EDB8">
      <animate attributeName="fill" values="#54EDB8;#FFB847;#54EDB8" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="322" y="19" font-weight="600">23%  58°</text>
    <text x="392" y="19">12:41</text>
  </g>
  <!-- popover arrow + body -->
  <path d="M308 34 l8 -8 l8 8 z" fill="#111728"/>
  <rect x="10" y="34" width="420" height="556" rx="18" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.12"/>
  <g clip-path="url(#pop)"><circle cx="80" cy="110" r="170" fill="url(#g1)"/><circle cx="380" cy="520" r="190" fill="url(#g2)"/></g>

  <text x="34" y="76" font-size="19" font-weight="800" fill="#fff">OldMacBro</text>
  <text x="34" y="94" font-size="11" fill="#8f9bb3">MacBookAir7,2 · macOS 12.7</text>
  <g transform="translate(330 64)">
    <rect width="76" height="22" rx="11" fill="#54EDB8" fill-opacity="0.16" stroke="#54EDB8" stroke-opacity="0.6"/>
    <text x="38" y="15" text-anchor="middle" font-size="10" font-weight="800" fill="#54EDB8" letter-spacing="0.8">HEALTHY</text>
  </g>

  <!-- three rings -->
  <g font-weight="700" text-anchor="middle">
    <g transform="translate(90 170)">
      <circle r="44" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="9"/>
      <circle r="44" fill="none" stroke="#54EDB8" stroke-width="9" stroke-linecap="round" stroke-dasharray="64 277" transform="rotate(-90)">
        <animate attributeName="stroke-dasharray" values="64 277;150 277;90 277;64 277" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#54EDB8;#FFB847;#54EDB8;#54EDB8" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text y="5" font-size="20" fill="#fff">23%</text><text y="22" font-size="9" fill="#8f9bb3" font-weight="500">1.42 GHz</text>
    </g>
    <g transform="translate(220 170)">
      <circle r="44" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="9"/>
      <circle r="44" fill="none" stroke="#54EDB8" stroke-width="9" stroke-linecap="round" stroke-dasharray="180 277" transform="rotate(-90)">
        <animate attributeName="stroke-dasharray" values="180 277;205 277;140 277;180 277" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text y="5" font-size="20" fill="#fff">65%</text><text y="22" font-size="9" fill="#8f9bb3" font-weight="500">5.2 GB</text>
    </g>
    <g transform="translate(350 170)">
      <circle r="44" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="9"/>
      <circle r="44" fill="none" stroke="#5CC7FF" stroke-width="9" stroke-linecap="round" stroke-dasharray="25 277" transform="rotate(-90)">
        <animate attributeName="stroke-dasharray" values="25 277;70 277;40 277;25 277" dur="8s" repeatCount="indefinite"/>
      </circle>
      <text y="5" font-size="20" fill="#fff">58°</text><text y="22" font-size="9" fill="#8f9bb3" font-weight="500">1,800 rpm</text>
    </g>
  </g>

  <!-- per-core bars -->
  <g transform="translate(30 236)">
    <rect width="380" height="118" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/>
    <g font-size="10" fill="#8f9bb3" font-family="SFMono-Regular, Menlo, monospace">
      <text x="14" y="24">C0</text><text x="14" y="44">C1</text><text x="14" y="64">C2</text><text x="14" y="84">C3</text>
    </g>
    <g fill="#fff" fill-opacity="0.08"><rect x="40" y="18" width="290" height="5" rx="2.5"/><rect x="40" y="38" width="290" height="5" rx="2.5"/><rect x="40" y="58" width="290" height="5" rx="2.5"/><rect x="40" y="78" width="290" height="5" rx="2.5"/></g>
    <rect x="40" y="18" width="90" height="5" rx="2.5" fill="#54EDB8"><animate attributeName="width" values="90;170;60;90" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="40" y="38" width="40" height="5" rx="2.5" fill="#54EDB8"><animate attributeName="width" values="40;120;200;40" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="40" y="58" width="120" height="5" rx="2.5" fill="#5CC7FF"><animate attributeName="width" values="120;50;140;120" dur="4.5s" repeatCount="indefinite"/></rect>
    <rect x="40" y="78" width="60" height="5" rx="2.5" fill="#5CC7FF"><animate attributeName="width" values="60;100;30;60" dur="5.5s" repeatCount="indefinite"/></rect>
    <polyline fill="none" stroke="#54EDB8" stroke-width="1.6" points="14,108 40,104 66,106 92,98 118,101 144,95 170,99 196,92 222,97 248,94 274,100 300,96 326,99 352,95 366,97">
      <animate attributeName="points" dur="6s" repeatCount="indefinite"
        values="14,108 40,104 66,106 92,98 118,101 144,95 170,99 196,92 222,97 248,94 274,100 300,96 326,99 352,95 366,97;
                14,104 40,106 66,98 92,101 118,95 144,99 170,92 196,97 222,94 248,100 274,96 300,99 326,95 352,97 366,93;
                14,108 40,104 66,106 92,98 118,101 144,95 170,99 196,92 222,97 248,94 274,100 300,96 326,99 352,95 366,97"/>
    </polyline>
  </g>

  <!-- quick actions -->
  <g font-size="13" font-weight="700">
    <g transform="translate(30 372)">
      <rect width="184" height="40" rx="11" fill="url(#btn)"/>
      <text x="92" y="25" text-anchor="middle" fill="#04121c">⚡ Smart Boost</text>
      <rect width="184" height="40" rx="11" fill="none" stroke="#5CC7FF" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.55;0.62;0.75" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(226 372)">
      <rect width="184" height="40" rx="11" fill="#54EDB8" fill-opacity="0.15" stroke="#54EDB8" stroke-opacity="0.5"/>
      <text x="92" y="25" text-anchor="middle" fill="#e9fff7">🌐 Flush DNS</text>
    </g>
    <g transform="translate(30 420)">
      <rect width="184" height="40" rx="11" fill="#9E7AFF" fill-opacity="0.15" stroke="#9E7AFF" stroke-opacity="0.5"/>
      <text x="92" y="25" text-anchor="middle" fill="#efe9ff">🗑 Uninstall Apps</text>
    </g>
    <g transform="translate(226 420)">
      <rect width="184" height="40" rx="11" fill="#FFB847" fill-opacity="0.15" stroke="#FFB847" stroke-opacity="0.5"/>
      <text x="92" y="25" text-anchor="middle" fill="#fff4e3">🔕 Silent Mode</text>
    </g>
  </g>

  <!-- toast -->
  <g transform="translate(70 486)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.67;0.92;1" dur="8s" repeatCount="indefinite"/>
    <rect width="300" height="34" rx="17" fill="#000" fill-opacity="0.78" stroke="#5CC7FF" stroke-opacity="0.6"/>
    <text x="150" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Closed 3 idle apps, freed 1.4 GB</text>
  </g>

  <!-- footer -->
  <g transform="translate(30 540)">
    <rect width="150" height="34" rx="10" fill="url(#btn)"/>
    <text x="75" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#04121c">▦ Control Center</text>
    <text x="300" y="22" text-anchor="end" font-size="9" fill="#8f9bb3" font-family="SFMono-Regular, Menlo, monospace">App 18 MB</text>
    <rect x="320" y="0" width="60" height="34" rx="10" fill="#FF5C54" fill-opacity="0.16" stroke="#FF5C54" stroke-opacity="0.5"/>
    <text x="350" y="22" text-anchor="middle" font-size="14" fill="#ffd9d7">⏻</text>
  </g>
</svg>
